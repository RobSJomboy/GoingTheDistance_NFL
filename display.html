<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Going the Distance — Display</title>
<link rel="stylesheet" href="gtd.css">
</head>
<body class="lay-lower clean">

<div id="stage">
  <div id="plate">
    <div class="kick" id="plateKick">JOMBOY MEDIA</div>
    <div class="name" id="plateName">GOING THE<br>DISTANCE</div>
    <div class="sub" id="plateSub"></div>
  </div>

  <div id="banner"></div>

  <div id="qcard">
    <div id="qhead">
      <span class="tier" id="qtier">1ST DOWN TRIVIA</span>
      <span class="drive" id="qdrive"></span>
    </div>
    <div id="clockbar"></div>
    <div id="qtext"></div>
    <div id="choices"></div>
  </div>

  <div id="fieldwrap">
    <div id="chyron"></div>
    <canvas id="field"></canvas>
    <div id="playcall"><div class="label"></div><div class="yards"></div></div>
  </div>
</div>

<div id="soundzone" class="hide">
  <b>SOUND</b> — drop your clips here<br><span id="szList">chiptune fallback</span>
</div>
<div id="diag">booting…</div>

<script src="gtd.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const TOPIC = (qs.get('topic') || '').trim();
const IN_FRAME = window.self !== window.top;
let SNAP = false;

function diag(t){ $('diag').textContent = t; }

/* ---------------------------------------------------------------
   LAYOUT

   ?layout= wins, then whatever the control page suggests, then the
   window's own shape — so dropping this into a 1080x1920 OBS source with
   no query string still comes up in the vertical cut.
   --------------------------------------------------------------- */
const URL_LAYOUT = (qs.get('layout') || '').toLowerCase();
let layout = URL_LAYOUT || (window.innerHeight > window.innerWidth ? 'vert' : 'lower');
function setLayout(l){
  const v = ['lower','full','vert'].includes(l) ? l : 'lower';
  layout = v;
  document.body.className = 'lay-' + v + (qs.get('dev') ? '' : ' clean');
  autoScale();
}
/* Fit the art to whatever the source is actually sized at. The field only
   ever upscales by a whole number, so it stays hard-edged; the type gets
   the leftover fractional room. */
let curPx = 4;
function autoScale(){
  const W = window.innerWidth, H = window.innerHeight;
  const fieldW = layout === 'vert' ? 270 : 480;
  const forced = +qs.get('px') || 0;
  let px = forced || Math.max(1, Math.floor(W / fieldW));
  if(layout === 'vert'){ while(px > 1 && 378 * px > H * 0.62) px--; }
  else if(layout === 'full'){ while(px > 1 && 124 * px > H * 0.42) px--; }
  applyPx(px);
}
function applyPx(px){
  curPx = px;
  const fieldW = layout === 'vert' ? 270 : 480;
  const r = document.documentElement.style;
  r.setProperty('--px', px);
  const s = +qs.get('s') || (fieldW * px) / (layout === 'vert' ? 900 : 1920);
  r.setProperty('--s', Math.max(0.25, Math.min(1.8, s)).toFixed(3));
}
/* Whatever the question card ends up being — one line or four — the stack
   has to fit the source, so step the field down until it does. Called after
   every render because the card's height is content-dependent. */
function contentHeight(){
  const stage = document.getElementById('stage');
  const gap = parseFloat(getComputedStyle(stage).rowGap) || 0;
  let n = 0, h = 0;
  Array.from(stage.children).forEach(el => {
    if(!el.offsetHeight) return;
    h += el.offsetHeight; n++;
  });
  return h + Math.max(0, n - 1) * gap;
}
function fit(){
  if(+qs.get('px')) return;
  /* #stage is a full-bleed flex box, so its own height is never the answer —
     measure what is actually in it */
  let guard = 6;
  while(guard-- > 0 && curPx > 1 && contentHeight() > window.innerHeight - 4) applyPx(curPx - 1);
}
setLayout(layout);
addEventListener('resize', autoScale);

/* =====================================================================
   STATE
   ===================================================================== */
let ST = {
  mode:'drive',
  plate:{ on:true, kick:"JOMBOY MEDIA", name:"GOING THE\nDISTANCE", sub:"" },
  banner:{ on:false, text:'', bad:false },
  q:{ on:false, text:'', choices:[], correct:0, tier:1, lock:-1, reveal:false, gone:[], num:1 },
  clock:{ on:false, dur:20, seq:0 },
  drive:{ los:1, down:1, dist:10, first:11, score:0, ll:{ pi:true, to:true, cc:true }, safe:1 },
  h2h:{ ball:50, poss:0, teams:[{name:'JAKE',color:'#1b3a5c',score:0},{name:'TREV',color:'#7c1d2b',score:0}] },
  play:null,
  pal:{ offP:'#1b3a5c', offT:'#fbcc7a', defP:'#7c1d2b', defT:'#e8eef4', skin:'#b07a52' },
  cue:null
};

/* =====================================================================
   ANIMATION

   A play is one short cutscene: a beat of stillness, the run, then the
   result frame. The clock is read once per frame from performance.now(),
   never accumulated, so a dropped frame in OBS shortens the animation
   instead of desyncing it from the state.
   ===================================================================== */
let anim = null, lastPlayId = null, flash = 0, chyronPending = false;
const now = () => performance.now();
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

function startPlay(p){
  const dist = Math.abs((p.to != null ? p.to : p.from) - p.from);
  anim = {
    t0:now(), pre:280,
    run:Math.min(2400, 420 + dist * 34),
    hold:2600, p:p, called:false
  };
  if(p.key === 'inc') anim.run = 900;
  if(p.fg) { anim.pre = 420; anim.run = 1100; }
}

function animSpec(){
  const view = layout === 'vert' ? 'v' : 'h';
  const mode = ST.mode;
  const base = mode === 'h2h'
    ? { los:ST.h2h.ball, first:ST.h2h.target }
    : { los:ST.drive.los, first:ST.drive.first };

  const spec = {
    view:view, los:base.los, first:base.first, chains:true,
    runner:null, defenders:[], ball:null, flash:0,
    pal:{
      off:GTD.teamPal(GTD.PAL.off, ST.pal.offP, ST.pal.offT, ST.pal.skin),
      def:GTD.teamPal(GTD.PAL.def, ST.pal.defP, ST.pal.defT, ST.pal.skin)
    },
    ez:{ own:shade(mode === 'h2h' ? ST.h2h.teams[1].color : ST.pal.offP),
         opp:shade(mode === 'h2h' ? ST.h2h.teams[0].color : ST.pal.defP) }
  };

  const dirFlip = mode === 'h2h' && ST.h2h.poss === 1;

  if(!anim){
    spec.runner = { yard:base.los, frame:'idle', flip:dirFlip };
    spec.defenders = defAt(base.los + (dirFlip ? -9 : 9), dirFlip);
    spec.flash = flash;
    return spec;
  }

  const p = anim.p, t = now() - anim.t0;
  const from = p.from;
  /* the ball is spotted on the goal line but nobody stops there — carry the
     sprite four yards past it so a score reads as a score */
  const to = (p.to != null ? p.to : p.from) + (p.td ? 4 : 0);

  if(t < anim.pre){
    spec.runner = { yard:from, frame:p.fg ? 'kick' : 'idle', flip:dirFlip };
    spec.defenders = defAt(from + (dirFlip ? -10 : 10), dirFlip);
    return spec;
  }
  const rt = Math.min(1, (t - anim.pre) / anim.run);
  const y = from + (to - from) * ease(rt);
  const stepped = Math.floor((t - anim.pre) / 95) % 2 ? 'runB' : 'runA';

  if(p.key === 'inc'){
    spec.runner = { yard:from, frame:rt < 1 ? 'idle' : 'idle', flip:dirFlip };
    const fly = from + (dirFlip ? -16 : 16) * rt;
    spec.ball = { yard:Math.max(0, Math.min(100, fly)), lift:Math.sin(rt * Math.PI) * 30 };
    spec.defenders = defAt(from + (dirFlip ? -12 : 12), dirFlip);
  } else if(p.fg){
    spec.runner = { yard:from, frame:'kick', flip:dirFlip };
    const goal = dirFlip ? -4 : 104;
    spec.ball = { yard:Math.max(-4, Math.min(104, from + (goal - from) * rt)), lift:Math.sin(rt * Math.PI) * 52 };
    spec.defenders = [];
  } else if(rt < 1){
    spec.runner = { yard:y, frame:stepped, flip:dirFlip };
    const dTarget = to + (dirFlip ? -2 : 2);
    const dStart = from + (dirFlip ? -11 : 11);
    spec.defenders = defAt(dStart + (dTarget - dStart) * rt, dirFlip, stepped);
  } else {
    const down = p.key === 'sack' || p.key === 'tfl' || p.key === 'fum';
    const scored = p.td;
    spec.runner = { yard:to, frame:scored ? 'cheer' : down ? 'down' : 'idle', flip:dirFlip };
    spec.defenders = down ? defAt(to + (dirFlip ? -2 : 2), dirFlip, 'down') : defAt(to + (dirFlip ? -4 : 4), dirFlip);
    spec.los = to;
  }
  spec.flash = flash;
  return spec;
}

function defAt(yard, flip, frame){
  const y = Math.max(-2, Math.min(102, yard));
  return [
    { yard:y,        lane:-13, flip:!flip, frame:frame || 'runA' },
    { yard:y + (flip ? 3 : -3), lane:12, flip:!flip, frame:frame || 'runB' }
  ];
}

function shade(hex){
  try{
    const n = parseInt(String(hex).replace('#',''), 16);
    const k = 0.55;   /* dark enough to sit under white lines, light enough to read as a colour */
    const r = Math.round(((n >> 16) & 255) * k), g = Math.round(((n >> 8) & 255) * k), b = Math.round((n & 255) * k);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }catch(e){ return '#0d1f2d'; }
}

/* =====================================================================
   FRAME
   ===================================================================== */
let lastFrame = 0;
function frame(){
  lastFrame = now();
  /* touchdown and field-goal flashes decay on their own so the state
     payload never has to carry an animation value */
  if(flash > 0) flash = Math.max(0, flash - 0.035);

  const ctx = GTD.drawField($('field'), animSpec());
  drawMarks(ctx);

  if(anim){
    const t = now() - anim.t0;
    if(!anim.called && t >= anim.pre + anim.run){
      anim.called = true; showCall(anim.p);
      if(chyronPending){ chyronPending = false; renderChyron(); }
    }
    if(t > anim.pre + anim.run + anim.hold){ anim = null; hideCall(); }
  }
  paintClock();
}
function loop(){ frame(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
/* If rAF stalls — a hidden tab, a source OBS has stopped rendering — keep
   painting on a timer so the last state is at least correct on screen. */
setInterval(() => { if(now() - lastFrame > 400) frame(); }, 250);
(() => {
  let last = null;
  setInterval(() => {
    const t = document.timeline.currentTime;
    if(last !== null && t === last) document.documentElement.classList.add('no-anim');
    else if(last !== null) document.documentElement.classList.remove('no-anim');
    last = t;
  }, 1000);
})();

/* the safe havens, drawn as little gold pylons on the near sideline */
function drawMarks(ctx){
  if(ST.mode !== 'drive' || !ctx) return;
  const view = layout === 'vert' ? 'v' : 'h';
  const g = GTD.geo(view);
  (ST.drive.marks || [25, 50, 80]).forEach(m => {
    const p = GTD.xy(view, m, 1);
    const passed = ST.drive.los >= m;
    ctx.fillStyle = passed ? '#fbcc7a' : 'rgba(251,204,122,.32)';
    if(view === 'v') ctx.fillRect(Math.round(p[0]) + 3, Math.round(p[1]) - 2, 5, 4);
    else ctx.fillRect(Math.round(p[0]) - 2, Math.round(p[1]) + 3, 4, 5);
  });
}

/* =====================================================================
   CHYRON
   ===================================================================== */
function cell(kind, k, v, cls){
  const d = document.createElement('div');
  d.className = 'cell ' + (kind || '');
  const kk = document.createElement('div'); kk.className = 'k'; kk.textContent = k;
  const vv = document.createElement('div'); vv.className = 'v ' + (cls || ''); vv.textContent = v;
  d.append(kk, vv);
  return d;
}
function renderChyron(){
  const host = $('chyron'); host.innerHTML = '';
  if(ST.mode === 'h2h'){
    const T = ST.h2h.teams, b = ST.h2h.ball;
    T.forEach((tm, i) => {
      const d = document.createElement('div');
      d.className = 'cell team' + (ST.h2h.poss === i ? ' poss' : '');
      const kk = document.createElement('div'); kk.className = 'k';
      kk.textContent = ST.h2h.poss === i ? '● BALL' : 'ON DECK';
      const vv = document.createElement('div'); vv.className = 'v';
      const sw = document.createElement('span'); sw.className = 'swatch'; sw.style.background = tm.color;
      const nm = document.createElement('span'); nm.textContent = tm.name + ' ' + tm.score;
      vv.append(sw, nm); d.append(kk, vv); host.appendChild(d);
      if(i === 0){
        const arrow = ST.h2h.poss === 0 ? '▶' : '◀';
        const spotTxt = b === 50 ? 'MIDFIELD' : b > 50 ? T[1].name.slice(0,4) + ' ' + (100 - b) : T[0].name.slice(0,4) + ' ' + b;
        host.appendChild(cell('grow', 'BALL ON', arrow + '  ' + spotTxt + '  ' + arrow, 'gold'));
      }
    });
  } else {
    const D = ST.drive;
    host.appendChild(cell('down', 'DOWN', GTD.distText(D.down, D.dist, D.los)));
    host.appendChild(cell('', 'BALL ON', GTD.spot(D.los)));
    host.appendChild(cell(layout === 'vert' ? '' : 'grow', 'TO THE HOUSE', Math.max(0, 100 - Math.round(D.los)) + ' YDS', 'gold'));
    const ll = document.createElement('div');
    ll.className = 'cell lifelines' + (layout === 'vert' ? ' wide' : ' grow');
    [['pi','PASS INT.'], ['to','TIMEOUT'], ['cc','CHALLENGE']].forEach(([k, label]) => {
      const s = document.createElement('span');
      s.className = 'll ' + (D.ll && D.ll[k] ? 'live' : 'used');
      s.textContent = label; ll.appendChild(s);
    });
    host.appendChild(cell('', 'POINTS', String(D.score), 'gold'));
    host.appendChild(ll);
  }
}

/* =====================================================================
   QUESTION CARD
   ===================================================================== */
const KEYS = ['A', 'B', 'C', 'D'];
function renderQ(){
  const q = ST.q;
  $('qcard').classList.toggle('on', !!q.on);
  if(!q.on) return;
  const tierName = ['', 'OPENING DRIVE', 'MIDFIELD', 'RED ZONE'][q.tier] || 'MIDFIELD';
  $('qtier').textContent = tierName;
  $('qtier').className = 'tier t' + q.tier;
  $('qdrive').textContent = q.num ? 'PLAY ' + q.num : '';
  $('qtext').textContent = q.text || '';
  fitText(q.text || '', (q.choices || []));
  const host = $('choices'); host.innerHTML = '';
  (q.choices || []).forEach((c, i) => {
    const d = document.createElement('div');
    let cls = 'ch';
    if((q.gone || []).includes(i)) cls += ' gone';
    if(q.reveal){
      if(i === q.correct) cls += ' right';
      else if(i === q.lock) cls += ' wrong';
    } else if(i === q.lock) cls += ' lock';
    d.className = cls;
    const k = document.createElement('span'); k.className = 'key'; k.textContent = KEYS[i];
    const t = document.createElement('span'); t.className = 'txt'; t.textContent = c;
    d.append(k, t); host.appendChild(d);
  });
}

/* A long question set in one size either overflows the card or forces
   every short question to be small. Scale from the character count rather
   than measuring and reflowing: it is one class of question, the answer is
   stable frame to frame, and nothing has to settle. */
function fitText(text, choices){
  const n = String(text).length;
  const qf = n <= 46 ? 1 : n <= 62 ? 0.88 : n <= 82 ? 0.76 : n <= 104 ? 0.66 : 0.58;
  const longest = choices.reduce((m, c) => Math.max(m, String(c).length), 0);
  const lim = layout === 'vert' ? 34 : 24;
  const cf = longest <= lim ? 1 : longest <= lim * 1.5 ? 0.84 : 0.7;
  const r = document.documentElement.style;
  r.setProperty('--qf', qf); r.setProperty('--cf', cf);
}

/* =====================================================================
   CLOCK — the display runs its own countdown off a sequence number rather
   than a resynced timestamp. Two machines' clocks disagree by seconds and
   the real timing is measured on the control page anyway, so what matters
   here is that the bar starts when the question does.
   ===================================================================== */
let clockT0 = 0, clockSeq = -1, clockDur = 20, clockOn = false;
const SEGS = 24;
function paintClock(){
  const bar = $('clockbar');
  if(!clockOn){ bar.className = 'hide'; return; }
  const left = Math.max(0, clockDur - (now() - clockT0) / 1000);
  const f = clockDur > 0 ? left / clockDur : 0;
  const lit = Math.ceil(f * SEGS);
  if(bar.children.length !== SEGS){
    bar.innerHTML = '';
    for(let i = 0; i < SEGS; i++) bar.appendChild(document.createElement('i'));
  }
  for(let i = 0; i < SEGS; i++) bar.children[i].className = i < lit ? '' : 'off';
  bar.className = f > 0.5 ? '' : f > 0.22 ? 'warn' : 'hot';
}

/* =====================================================================
   PLAY CALL + BANNER
   ===================================================================== */
function showCall(p){
  const el = $('playcall');
  el.querySelector('.label').textContent = p.label || '';
  const y = p.yards;
  el.querySelector('.yards').textContent = p.sub ? p.sub :
    p.td ? '7 POINTS' : p.fg ? '3 POINTS' :
    y > 0 ? '+' + y + ' YARDS' : y < 0 ? y + ' YARDS' : 'NO GAIN';
  el.className = 'on' + (p.td || p.fg ? ' score' : p.good === false ? ' bad' : (p.key === 'bomb' || p.key === 'big' ? ' big' : ''));
  if(p.td || p.fg) flash = 1;
}
function hideCall(){ $('playcall').className = ''; }

function renderPlate(){
  const p = ST.plate || {};
  $('plate').classList.toggle('on', !!p.on);
  $('plateKick').textContent = p.kick || '';
  $('plateName').innerHTML = String(p.name || '').split('\n').map(escapeHTML).join('<br>');
  $('plateSub').textContent = p.sub || '';
  const b = ST.banner || {};
  $('banner').className = (b.on ? 'on' : '') + (b.bad ? ' bad' : '');
  $('banner').textContent = b.text || '';
}
function escapeHTML(s){ return String(s).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c])); }

/* =====================================================================
   SOUND ON THE OVERLAY

   Off unless you ask for it with ?sound=1. OBS browser sources are started
   with autoplay allowed, so the stingers just fire; in a normal browser tab
   the drop zone doubles as the click that unlocks WebAudio.
   ===================================================================== */
const SOUND = qs.get('sound') === '1';
let lastCueId = null;
if(SOUND){
  const z = $('soundzone');
  z.classList.remove('hide');
  GTD.initSound().then(keys => {
    $('szList').textContent = keys.length ? keys.join(' · ') : 'chiptune fallback';
  });
  z.addEventListener('click', () => { GTD.audioCtx(); GTD.playCue('snap'); });
  ['dragenter','dragover'].forEach(e => z.addEventListener(e, ev => { ev.preventDefault(); z.style.borderColor = '#fbcc7a'; }));
  ['dragleave','drop'].forEach(e => z.addEventListener(e, ev => { ev.preventDefault(); z.style.borderColor = ''; }));
  z.addEventListener('drop', ev => {
    GTD.dropFiles(ev.dataTransfer.files).then(() => {
      $('szList').textContent = Object.keys(GTD.listClips()).join(' · ') || 'chiptune fallback';
    });
  });
  setTimeout(() => { if(!qs.get('dev')) z.classList.add('hide'); }, 20000);
}

/* =====================================================================
   APPLY
   ===================================================================== */
function apply(st){
  if(!st || typeof st !== 'object') return;
  ['mode','plate','banner','q','drive','h2h','pal'].forEach(k => { if(st[k] !== undefined) ST[k] = st[k]; });
  if(st.layout && !URL_LAYOUT) setLayout(st.layout);

  if(st.clock){
    const c = st.clock;
    clockDur = c.dur || 20;
    clockOn = !!c.on;
    if(c.seq !== clockSeq){
      clockSeq = c.seq;
      clockT0 = now() - (c.elapsed || 0) * 1000;
    }
    if(!c.run && c.on){ /* frozen: hold whatever is on the bar */ }
  }

  let held = false;
  if(st.play && st.play.id !== lastPlayId){
    lastPlayId = st.play.id;
    startPlay(st.play);
    /* the new down and distance rides along with the play, so hold it back
       until the runner actually gets there — otherwise the chyron reads
       2nd & 4 while the guy is still standing on 1st & 10 */
    held = true; chyronPending = true;
  } else if(st.play === null){
    anim = null; hideCall(); chyronPending = false;
  }

  if(SOUND && st.cue && st.cue.id !== lastCueId){
    lastCueId = st.cue.id;
    GTD.playCue(st.cue.name);
  }

  if(!held) renderChyron();
  renderQ(); renderPlate(); autoScale(); fit(); frame();
  if(!SNAP) relayStatus();
}

/* =====================================================================
   MULTI-RELAY SUBSCRIBE

   One SSE stream per relay, all live at once. Several relays means several
   copies of every message, so `n` — the control page's clock-based
   sequence number — decides what actually gets applied; anything at or
   below the last applied sequence is a duplicate or a straggler.

   ntfy pings every 45s, so silence past 60s on one relay is worth a catch
   up poll and past 95s that stream gets rebuilt. Nothing polls on a
   schedule; that is what quietly eats the anonymous rate limit over a
   two-hour taping.
   ===================================================================== */
const RELAYS = (() => {
  const q = qs.get('relays');
  if(q) return q.split(',').map(h => ({ host:h.trim(), label:h.trim() })).filter(r => r.host);
  return GTD.RELAYS;
})();
const LINK = RELAYS.map(r => ({ ...r, es:null, lastMsgAt:Date.now(), since:Math.floor(Date.now() / 1000) }));
let lastSeq = 0;

function relayStatus(){
  if(SNAP) return;
  const up = LINK.filter(l => l.es && l.es.readyState === 1).length;
  diag(layout + ' · ' + up + '/' + LINK.length + ' relays');
}

function accept(raw){
  let st;
  try{ st = JSON.parse(raw); }catch(e){ return; }
  if(!st || typeof st !== 'object') return;
  const n = +st.n || 0;
  if(n && n <= lastSeq) return;      /* duplicate copy, or a slow relay with stale state */
  if(n) lastSeq = n;
  try{ apply(st); }catch(e){ diag('render: ' + e.message); }
}
function envelope(l, env){ l.lastMsgAt = Date.now(); if(env && env.message) accept(env.message); }

function connect(l){
  if(!TOPIC || IN_FRAME) return;
  if(l.es) l.es.close();
  l.es = new EventSource('https://' + l.host + '/' + encodeURIComponent(TOPIC) + '/sse');
  l.es.onmessage = ev => { try{ envelope(l, JSON.parse(ev.data)); }catch(e){} };
  l.es.onopen = () => { l.lastMsgAt = Date.now(); relayStatus(); };
  l.es.onerror = () => relayStatus();
}
function fetchWithTimeout(url, ms){
  if(typeof AbortController === 'undefined') return fetch(url);
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), ms);
  return fetch(url, { signal:ac.signal }).finally(() => clearTimeout(t));
}
async function pollOnce(l){
  if(!TOPIC || IN_FRAME) return;
  const from = l.since;
  l.since = Math.floor(Date.now() / 1000);
  try{
    const res = await fetchWithTimeout('https://' + l.host + '/' + encodeURIComponent(TOPIC) + '/json?poll=1&since=' + from, 8000);
    if(res.status === 429) return;
    (await res.text()).split('\n').filter(Boolean).forEach(line => { try{ envelope(l, JSON.parse(line)); }catch(e){} });
  }catch(e){}
}

/* the control page's own preview runs on this, free and instant */
let BC = null;
try{
  BC = new BroadcastChannel('going_the_distance');
  BC.onmessage = ev => { const d = ev.data; if(!d || d.__req) return; accept(JSON.stringify(d)); };
}catch(e){}

/* no-network fallback: the whole state base64'd into the fragment */
function readSnapshot(){
  const m = /[#&]s=([^&]+)/.exec(location.hash || '');
  if(!m) return false;
  try{
    const b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
    SNAP = true;
    accept(decodeURIComponent(escape(atob(b64))));
    diag('loaded from a URL');
    return true;
  }catch(e){ return false; }
}

renderChyron(); renderQ(); renderPlate(); fit(); frame();

if(IN_FRAME){
  try{ if(BC) BC.postMessage({ __req:1 }); }catch(e){}
  diag('');
} else {
  const hadSnap = readSnapshot();
  if(TOPIC){
    LINK.forEach(connect);
    relayStatus();
    setInterval(() => {
      LINK.forEach(l => {
        const quiet = Date.now() - l.lastMsgAt;
        if(quiet > 95000){ connect(l); l.lastMsgAt = Date.now(); pollOnce(l); }
        else if(quiet > 60000){ pollOnce(l); }
      });
      relayStatus();
    }, 15000);
    document.addEventListener('visibilitychange', () => {
      if(document.hidden) return;
      LINK.forEach(l => { if(Date.now() - l.lastMsgAt > 20000) pollOnce(l); });
    });
    /* an OBS source that restarts mid-taping comes back where the show is */
    LINK.forEach(async l => {
      try{
        const res = await fetchWithTimeout('https://' + l.host + '/' + encodeURIComponent(TOPIC) + '/json?poll=1&since=6h', 8000);
        const lines = (await res.text()).split('\n').filter(Boolean);
        if(!lines.length) return;
        const last = JSON.parse(lines[lines.length - 1]);
        if(last && last.message) accept(last.message);
      }catch(e){}
    });
  } else if(!hadSnap){
    diag('no ?topic= — nothing to listen to');
  }
}
</script>
