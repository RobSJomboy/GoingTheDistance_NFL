<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Going the Distance — Display</title>
<link rel="stylesheet" href="gtd.css">
</head>
<body class="lay-lower clean">

<div id="stage">
  <div id="plate">
    <div class="kick" id="plateKick">JOMBOY MEDIA</div>
    <div class="name" id="plateName">GOING THE<br>DISTANCE</div>
    <div class="sub" id="plateSub"></div>
  </div>

  <div id="banner"></div>

  <div id="qcard">
    <div id="qhead">
      <span class="tier" id="qtier">1ST DOWN TRIVIA</span>
      <span class="drive" id="qdrive"></span>
    </div>
    <div id="clockbar"></div>
    <div id="qtext"></div>
    <div id="choices"></div>
  </div>

  <div id="fieldwrap">
    <div id="chyron"></div>
    <canvas id="field"></canvas>
    <div id="playcall"><div class="label"></div><div class="yards"></div></div>
  </div>
</div>

<div id="soundzone" class="hide">
  <b>SOUND</b> — drop your clips here<br><span id="szList">chiptune fallback</span>
</div>
<div id="diag">booting…</div>

<script src="gtd.js"></script>
<script src="gtdview.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const TOPIC = (qs.get('topic') || '').trim();
const IN_FRAME = window.self !== window.top;
const SOUND = qs.get('sound') === '1';
let SNAP = false;

/* Everything on screen is GTDView's job. This page only has to get state to
   it: over ntfy for a real OBS source, over BroadcastChannel for the control
   page's own preview, or out of the URL when every relay is down. */
const view = GTDView.mount({
  layout:qs.get('layout') || '',
  dev:!!qs.get('dev'),
  px:qs.get('px'), s:qs.get('s'),
  sound:SOUND,
  onApplied:() => { if(!SNAP) relayStatus(); }
});
view.render();

/* =====================================================================
   SOUND ON THE OVERLAY

   Off unless you ask for it with ?sound=1. OBS browser sources are started
   with autoplay allowed, so the stingers just fire; in a normal browser tab
   the drop zone doubles as the click that unlocks WebAudio.
   ===================================================================== */
if(SOUND){
  const z = $('soundzone');
  z.classList.remove('hide');
  GTD.initSound().then(keys => {
    $('szList').textContent = keys.length ? keys.join(' · ') : 'chiptune fallback';
  });
  z.addEventListener('click', () => { GTD.audioCtx(); GTD.playCue('snap'); });
  ['dragenter','dragover'].forEach(e => z.addEventListener(e, ev => { ev.preventDefault(); z.style.borderColor = '#fbcc7a'; }));
  ['dragleave','drop'].forEach(e => z.addEventListener(e, ev => { ev.preventDefault(); z.style.borderColor = ''; }));
  z.addEventListener('drop', ev => {
    GTD.dropFiles(ev.dataTransfer.files).then(() => {
      $('szList').textContent = Object.keys(GTD.listClips()).join(' · ') || 'chiptune fallback';
    });
  });
  setTimeout(() => { if(!qs.get('dev')) z.classList.add('hide'); }, 20000);
}

/* =====================================================================
   MULTI-RELAY SUBSCRIBE

   One SSE stream per relay, all live at once. Several relays means several
   copies of every message, so `n` — the control page's clock-based
   sequence number — decides what actually gets applied; anything at or
   below the last applied sequence is a duplicate or a straggler.

   ntfy pings every 45s, so silence past 60s on one relay is worth a catch
   up poll and past 95s that stream gets rebuilt. Nothing polls on a
   schedule; that is what quietly eats the anonymous rate limit over a
   two-hour taping.
   ===================================================================== */
const RELAYS = (() => {
  const q = qs.get('relays');
  if(q) return q.split(',').map(h => ({ host:h.trim(), label:h.trim() })).filter(r => r.host);
  return GTD.RELAYS;
})();
const LINK = RELAYS.map(r => ({ ...r, es:null, lastMsgAt:Date.now(), since:Math.floor(Date.now() / 1000) }));
let lastSeq = 0;

function relayStatus(){
  if(SNAP) return;
  const up = LINK.filter(l => l.es && l.es.readyState === 1).length;
  view.diag(view.layout() + ' · ' + up + '/' + LINK.length + ' relays');
}

function accept(raw){
  let st;
  try{ st = JSON.parse(raw); }catch(e){ return; }
  if(!st || typeof st !== 'object') return;
  const n = +st.n || 0;
  if(n && n <= lastSeq) return;      /* duplicate copy, or a slow relay with stale state */
  if(n) lastSeq = n;
  try{ view.apply(st); }catch(e){ view.diag('render: ' + e.message); }
}
function envelope(l, env){ l.lastMsgAt = Date.now(); if(env && env.message) accept(env.message); }

function connect(l){
  if(!TOPIC || IN_FRAME) return;
  if(l.es) l.es.close();
  l.es = new EventSource('https://' + l.host + '/' + encodeURIComponent(TOPIC) + '/sse');
  l.es.onmessage = ev => { try{ envelope(l, JSON.parse(ev.data)); }catch(e){} };
  l.es.onopen = () => { l.lastMsgAt = Date.now(); relayStatus(); };
  l.es.onerror = () => relayStatus();
}
function fetchWithTimeout(url, ms){
  if(typeof AbortController === 'undefined') return fetch(url);
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), ms);
  return fetch(url, { signal:ac.signal }).finally(() => clearTimeout(t));
}
async function pollOnce(l){
  if(!TOPIC || IN_FRAME) return;
  const from = l.since;
  l.since = Math.floor(Date.now() / 1000);
  try{
    const res = await fetchWithTimeout('https://' + l.host + '/' + encodeURIComponent(TOPIC) + '/json?poll=1&since=' + from, 8000);
    if(res.status === 429) return;
    (await res.text()).split('\n').filter(Boolean).forEach(line => { try{ envelope(l, JSON.parse(line)); }catch(e){} });
  }catch(e){}
}

/* the control page's own preview runs on this, free and instant */
let BC = null;
try{
  BC = new BroadcastChannel('going_the_distance');
  BC.onmessage = ev => { const d = ev.data; if(!d || d.__req) return; accept(JSON.stringify(d)); };
}catch(e){}

/* no-network fallback: the whole state base64'd into the fragment */
function readSnapshot(){
  const m = /[#&]s=([^&]+)/.exec(location.hash || '');
  if(!m) return false;
  try{
    const b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
    SNAP = true;
    accept(decodeURIComponent(escape(atob(b64))));
    view.diag('loaded from a URL');
    return true;
  }catch(e){ return false; }
}

if(IN_FRAME){
  try{ if(BC) BC.postMessage({ __req:1 }); }catch(e){}
  view.diag('');
} else {
  const hadSnap = readSnapshot();
  if(TOPIC){
    LINK.forEach(connect);
    relayStatus();
    setInterval(() => {
      LINK.forEach(l => {
        const quiet = Date.now() - l.lastMsgAt;
        if(quiet > 95000){ connect(l); l.lastMsgAt = Date.now(); pollOnce(l); }
        else if(quiet > 60000){ pollOnce(l); }
      });
      relayStatus();
    }, 15000);
    document.addEventListener('visibilitychange', () => {
      if(document.hidden) return;
      LINK.forEach(l => { if(Date.now() - l.lastMsgAt > 20000) pollOnce(l); });
    });
    /* an OBS source that restarts mid-taping comes back where the show is */
    LINK.forEach(async l => {
      try{
        const res = await fetchWithTimeout('https://' + l.host + '/' + encodeURIComponent(TOPIC) + '/json?poll=1&since=6h', 8000);
        const lines = (await res.text()).split('\n').filter(Boolean);
        if(!lines.length) return;
        const last = JSON.parse(lines[lines.length - 1]);
        if(last && last.message) accept(last.message);
      }catch(e){}
    });
  } else if(!hadSnap){
    view.diag('no ?topic= — nothing to listen to');
  }
}
</script>
</body>
</html>
